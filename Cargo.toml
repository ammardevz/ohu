

[package]
name = "ohu"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["zeroize"] }
bcrypt = { version = "0.19.3", features = ["zeroize"] }
blake3 = { version = "1.8.7", features = ["zeroize"] }
ccm = "0.6.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
fast-md5 = "1.0.0"
hex = "0.4.3"
sha2 = { version = "0.11.0", features = ["zeroize"] }
sha3 = { version = "0.12.0", features = ["zeroize"] }
xxhash-rust = { version = "0.8.18", features = ["std", "xxh3"] }
